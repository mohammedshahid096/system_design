# version: "3.8"
name: load-balancer-docker-nginx

# Define the services
services:
  load-balancer:
    build: ./load-balancer
    container_name: load-balancer
    ports:
      - "8000:8000"
    depends_on:
      # Wait for the services to be healthy before starting Nginx
      user-service1:
        condition: service_healthy
      user-service2:
        condition: service_healthy

  user-service2:
    build: ./user-service
    container_name: user-service2
    ports:
      - "8002:8001"
    environment:
      - SERVER_SERVICE_NAME=user-service2
    healthcheck:
      # Checks if the /health endpoint returns a 200 OK status
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s # Gives the app 10s to boot up before health checks begin

  user-service1:
    build: ./user-service
    container_name: user-service1
    ports:
      - "8001:8001"
    environment:
      - SERVER_SERVICE_NAME=user-service1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
